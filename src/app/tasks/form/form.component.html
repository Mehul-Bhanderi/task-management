<div class="form-container">
  <div class="form-card">
    <h1>{{ isEditing ? 'Edit Task' : 'Create New Task' }}</h1>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title *</label>
        <input
          type="text"
          id="title"
          formControlName="title"
          class="form-control"
          [class.is-invalid]="submitted && f['title'].errors"
          placeholder="Enter task title"
        />
        <div class="error-text" *ngIf="submitted && f['title'].errors">
          Title is required
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          class="form-control textarea"
          placeholder="Enter task description"
          rows="4"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dueDate">Due Date *</label>
          <input
            type="date"
            id="dueDate"
            formControlName="dueDate"
            class="form-control"
            [class.is-invalid]="submitted && f['dueDate'].errors"
          />
          <div class="error-text" *ngIf="submitted && f['dueDate'].errors">
            Due date is required
          </div>
        </div>

        <div class="form-group">
          <label for="priority">Priority</label>
          <select formControlName="priority" class="form-control">
            <option *ngFor="let p of priorityOptions" [value]="p">{{ p }}</option>
          </select>
        </div>
      </div>

      <div class="form-row" *ngIf="isEditing">
        <div class="form-group">
          <label for="status">Status</label>
          <select formControlName="status" class="form-control">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="tags">Tags (comma-separated)</label>
        <input
          type="text"
          id="tags"
          formControlName="tags"
          class="form-control"
          placeholder="e.g., urgent, documentation, backend"
        />
      </div>

      <div class="form-group">
        <label for="files">Attach Files</label>
        <div class="file-upload">
          <input
            type="file"
            id="files"
            multiple
            (change)="onFileSelected($event)"
            class="file-input"
          />
          <label for="files" class="file-label">
            <span>Choose files...</span>
          </label>
        </div>
        <div class="selected-files" *ngIf="selectedFiles.length > 0">
          <p><strong>Selected Files:</strong></p>
          <ul>
            <li *ngFor="let file of selectedFiles">{{ file.name }} ({{ (file.size / 1024).toFixed(2) }} KB)</li>
          </ul>
        </div>
      </div>

      <div class="alert alert-error" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? 'Saving...' : (isEditing ? 'Update Task' : 'Create Task') }}
        </button>
        <button type="button" (click)="onCancel()" class="btn btn-secondary">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
